version = 1

# Research migrations and agent plans are not product Python surfaces.
exclude_patterns = [
  "backend/alembic/**",
  ".cursor/**",
  ".work/**",
  "legacy_v1/**",
  "thirdparty/**",
]

test_patterns = [
  "backend/tests/**",
  "**/test_*.py",
]

[[analyzers]]
name = "python"

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 88
  skip_doc_coverage = ["module", "magic", "init", "nonpublic"]
