version = 1

test_patterns = [
  "backend/tests/**",
  "**/test_*.py",
]

exclude_patterns = [
  "backend/alembic/**",
  "backend/tests/**",
]

[[analyzers]]
name = "python"

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 88
  skip_doc_coverage = ["module", "magic", "init", "nonpublic"]
